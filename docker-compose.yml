version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartnotify-postgres
    environment:
      POSTGRES_DB: smartnotify
      POSTGRES_USER: smartnotify
      POSTGRES_PASSWORD: smartnotify123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartnotify"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartnotify-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smartnotify-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartnotify
      SPRING_DATASOURCE_USERNAME: smartnotify
      SPRING_DATASOURCE_PASSWORD: smartnotify123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
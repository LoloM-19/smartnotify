spring:
  application:
    name: smartnotify

  datasource:
    url: jdbc:postgresql://localhost:5432/smartnotify
    username: smartnotify
    password: smartnotify123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  rate-limit:
    max-requests: 5
    window-seconds: 60